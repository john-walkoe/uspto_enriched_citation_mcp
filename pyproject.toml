[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "uspto-enriched-citation-mcp"
version = "1.0.0"
description = "MCP server for USPTO Enriched Citation API v3 with progressive disclosure"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "John Walkoe" }
]

dependencies = [
    "fastmcp[apps]>=3.4",
    "aiosqlite>=0.20",
    "httpx>=0.28.1",
    "pydantic>=2.10.6",
    "pydantic-settings>=2.7.1",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "click>=8.2.1",
    "structlog>=24.1.0",
    "starlette>=0.40.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "detect-secrets>=1.5.0",
    "pre-commit>=3.5.0",
    "mypy>=1.18.2",
    "black>=25.9.0",
    "ruff>=0.14.3",
]

[project.scripts]
uspto-enriched-citation-mcp = "uspto_enriched_citation_mcp.main:main"

[tool.pytest.ini_options]
# test_unified_key_management.py overwrites the REAL DPAPI-stored keys; it is
# also gated by CITATIONS_RUN_KEY_TESTS inside the module (defense in depth).
addopts = "--ignore=tests/test_unified_key_management.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# E/F/W: pycodestyle+pyflakes; C90: cyclomatic complexity gate (audit
# code-quality-metrics-standards.md ran with no committed config)
select = ["E", "F", "W", "C90"]
ignore = ["E501"]  # long lines: docstrings/guidance text dominate

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Composition root re-exports public names for back-compat + registers
# resources/tools after mcp construction (bootstrap ordering).
"src/uspto_enriched_citation_mcp/main.py" = ["F401", "E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
follow_imports = "silent"
