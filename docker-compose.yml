services:
  uspto-enriched-citations-mcp:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Required
      - USPTO_API_KEY=${USPTO_API_KEY}
      # Optional — endpoint auth (x-api-key header). Unset = open; set = enforced.
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      # Optional — add a CORS origin for direct claude.ai or reverse proxy access
      - CORS_EXTRA_ORIGIN=${CORS_EXTRA_ORIGIN:-}
      # Optional — additional domain(s) for MCP Apps CSP (comma-separated)
      - MCP_APP_EXTRA_DOMAINS=${MCP_APP_EXTRA_DOMAINS:-}
      # Transport is set to http in the Dockerfile; override here if needed
      - FASTMCP_TRANSPORT=${FASTMCP_TRANSPORT:-http}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
