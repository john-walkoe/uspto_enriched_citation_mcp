services:
  uspto-enriched-citations-mcp:
    build: .
    ports:
      # Loopback only: the reverse proxy is the intended front door, and
      # "8000:8000" published the MCP surface on every host interface.
      - "127.0.0.1:8000:8000"
    environment:
      # Required
      - USPTO_API_KEY=${USPTO_API_KEY}
      # Optional — endpoint auth (x-api-key header). Unset = open; set = enforced.
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET:-}
      # Optional — add a CORS origin for direct claude.ai or reverse proxy access
      - CORS_EXTRA_ORIGIN=${CORS_EXTRA_ORIGIN:-}
      # Optional — additional domain(s) for MCP Apps CSP (comma-separated)
      - MCP_APP_EXTRA_DOMAINS=${MCP_APP_EXTRA_DOMAINS:-}
      # Transport is set to http in the Dockerfile; override here if needed
      - FASTMCP_TRANSPORT=${FASTMCP_TRANSPORT:-http}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Set explicitly here too so the bind mounts below are the paths used.
      - LOG_DIR=${LOG_DIR:-/app/logs}
      - CITATIONS_AUTH_DB_PATH=${CITATIONS_AUTH_DB_PATH:-/app/data/mcp_auth.db}
    volumes:
      # The security log and, in OAuth mode, the whole user table and every
      # live refresh token used to sit on the container's ephemeral writable
      # layer: a --force-recreate signed every user out and discarded the
      # audit trail the 90-day retention claims to keep (S-40).
      - ./logs:/app/logs
      - ./data:/app/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
